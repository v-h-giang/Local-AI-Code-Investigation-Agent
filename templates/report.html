<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>$title</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--bg:#f5f7fb;--paper:#fff;--text:#1b2738;--muted:#56667a;--accent:#235aa6;--border:#dfe5ee;--code:#f0f3fa}
    body{margin:0;background:var(--bg);color:var(--text);line-height:1.65}
    header{background:#142b4a;color:#f7f9ff;padding:1.5rem clamp(1rem,5vw,4rem)}
    header h1{font-size:1.35rem;margin:0 0 .25rem}
    .subtitle{color:#c7d7ef;font-size:.91rem}
    .layout{max-width:1160px;margin:1.5rem auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:1.2rem;padding:0 1rem}
    aside{align-self:start;position:sticky;top:1rem;background:var(--paper);padding:1rem;border:1px solid var(--border);border-radius:12px}
    aside strong{display:block;margin-bottom:.5rem}aside a{display:block;padding:.28rem .1rem;color:var(--accent);font-size:.88rem;text-decoration:none;overflow-wrap:anywhere}
    article{min-width:0;padding:1.4rem clamp(1.1rem,3vw,2.2rem);background:var(--paper);border:1px solid var(--border);border-radius:12px}
    article h1{font-size:1.8rem}article h2{font-size:1.32rem;margin-top:2rem;border-bottom:1px solid var(--border);padding-bottom:.3rem}
    h3{font-size:1.1rem;margin-top:1.5rem}p,li{overflow-wrap:anywhere}a{color:var(--accent)}
    table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;margin:1rem 0}td,th{padding:.55rem .75rem;text-align:left;border:1px solid var(--border);vertical-align:top}th{background:var(--code)}tr:nth-child(even){background:#fafbfc}
    pre{background:var(--code);overflow-x:auto;padding:1rem;border-radius:8px}code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:var(--code);padding:.1rem .24rem;border-radius:4px}pre code{padding:0}
    blockquote{border-left:4px solid #90b3e5;background:#eef4fd;margin:1rem 0;padding:.5rem 1rem}
    img{max-width:100%;height:auto}hr{border:0;border-top:1px solid var(--border)}.footer{font-size:.8rem;color:var(--muted);margin-top:2rem}
    @media(max-width:760px){.layout{display:block}aside{position:static;margin-bottom:1rem}article{padding:1rem}}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101721;--paper:#1b2532;--text:#e7eef9;--muted:#9fb0c4;--accent:#9dc0ff;--border:#3c4c60;--code:#263449}header{background:#101d2e}blockquote{background:#202d40}th{background:#29384c}tr:nth-child(even){background:#202c3a}}
  </style>
</head>
<body>
<header><h1>Local Codebase Intelligence Agent</h1><div class="subtitle">Local Ollama · Source-backed analysis · Static relationships are not verified runtime behavior</div></header>
<div class="layout"><aside><strong>Contents</strong>$navigation</aside><article>$content<div class="footer">Generated by a local Python template. No AI tokens spent on HTML layout.</div></article></div>
</body>
</html>
